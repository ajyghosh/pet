name: Desktop builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: heykup-pets-windows-x64
          - name: Mac Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            artifact: heykup-pets-macos-apple-silicon
          - name: Mac Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: heykup-pets-macos-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm ci
      - name: Unit tests and production build
        run: npm run check
      - name: Install test browser
        run: npx playwright install chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Native lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Build app and installers
        if: runner.os == 'Windows'
        run: npm run desktop:build -- --ci --target ${{ matrix.target }} -- --locked
      - name: Build Mac application
        if: runner.os == 'macOS'
        run: npm run desktop:build -- --ci --target ${{ matrix.target }} --bundles app -- --locked
      - name: Package Mac disk image without mounting it
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/package-macos-dmg.sh '${{ matrix.target }}'
      - name: Archive Mac application preserving permissions and symlinks
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          bundle="src-tauri/target/$BUILD_TARGET/release/bundle"
          codesign --verify --deep --strict "$bundle/macos/heykup-pets.app"
          tar -czf "$bundle/$ARTIFACT_NAME.app.tar.gz" -C "$bundle/macos" heykup-pets.app
      - name: Generate installer checksums
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/release-checksums.mjs "src-tauri/target/$BUILD_TARGET/release/bundle"
      - name: Upload per-user Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload Mac installers
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
