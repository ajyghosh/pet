name: Windows checks and installers
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm ci
      - name: Unit tests and production build
        run: npm run check
      - name: Install test browser
        run: npx playwright install chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Native lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Build Windows installers with offline WebView2
        run: npm run desktop:build -- -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: miso-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
